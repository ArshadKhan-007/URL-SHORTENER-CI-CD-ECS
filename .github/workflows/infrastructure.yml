name: Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy
      tf_version:
        description: "Terraform version"
        required: false
        default: "1.10.0"
        type: string

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  TF_WORKING_DIR: ./aws-infrastructure

jobs:
  terraform:
    name: "Terraform ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write   # required for OIDC AWS auth


    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:

      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate with AWS via OIDC (no static keys)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      # 3. Install the requested Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ github.event.inputs.tf_version }}

      # 4. Init — download providers, configure S3 backend
      - name: Terraform Init
        run: terraform init -reconfigure

      # 5. Validate — catch config errors before touching AWS
      - name: Terraform Validate
        run: terraform validate

      # 6. Plan — preview what will change
      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      # 7a. Apply — only when action == apply
      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      # 7b. Destroy — only when action == destroy
      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve

      # 8. Show outputs after apply
      - name: Show Terraform Outputs
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform output

  # ── Trigger CI after infra is ready ────────────────────────────────────────
  trigger-ci:
    name: "Trigger CI Pipeline"
    runs-on: ubuntu-latest
    needs: terraform

    # Only fire after a successful apply — not after destroy
    if: |
      needs.terraform.result == 'success' &&
      github.event.inputs.action == 'apply'

    permissions:
      actions: write   # required to dispatch another workflow

    steps:
      - name: Trigger CI Pipeline
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: 'main',
            });
            console.log('CI Pipeline triggered successfully.');
